name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          node .github/scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Run extension security tests
        run: pnpm --filter @walletchan/extension test:security

      - name: Create Chrome zip
        run: pnpm zip

      - name: Create Firefox zip
        run: pnpm zip:firefox

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/zip/walletchan-v${{ steps.version.outputs.version }}.zip
            apps/extension/zip/walletchan-firefox-v${{ steps.version.outputs.version }}.zip
          body_path: ${{ runner.temp }}/release-notes.md
